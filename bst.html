const C=[
{title:'Chapter 1: Business, Trade and Commerce',notes:[
['1.1 Introduction','Business is an important economic activity. It makes goods and services available to people and supports economic development by creating jobs, using resources, increasing income and improving living standards.'],
['1.2 Meaning of Business','Business is an economic activity concerned with the production or purchase and sale of goods and services with the aim of earning profit and satisfying human needs.','Easy meaning: Business means making or buying and selling goods and services to earn income.','Examples: Grocery shop, clothing store, transport company and car factory.'],
['1.2.1 Characteristics of Business','1. Economic activity: performed to earn income.\n2. Production or procurement: goods are produced or purchased for sale.\n3. Sale or exchange: goods/services are exchanged for value.\n4. Dealings in goods and services: business deals in products or services.\n5. Regularity: activities are generally repeated.\n6. Profit motive: earning profit is important.\n7. Uncertainty of return: profit is not fixed.\n8. Business risk: possibility of loss exists.'],
['1.3 Classification of Business Activities','Business activities are broadly divided into Industry and Commerce. Industry is concerned with production or processing. Commerce includes trade and auxiliaries to trade.'],
['1.3.1 Industry','Primary industries are connected with natural resources. Extractive industries obtain products from nature (mining, fishing, farming); genetic industries breed plants and animals (poultry, cattle breeding).\n\nSecondary industries use materials from primary industries. Manufacturing converts raw materials into finished goods: analytical (separates components, e.g. oil refinery), synthetic (combines materials, e.g. cement), processing (several stages, e.g. sugar/paper) and assembling (joins parts, e.g. cars). Construction industries build roads, bridges, buildings, dams and canals.\n\nTertiary industries provide support services to other industries and trade, such as transport, banking, insurance, warehousing and communication.'],
['1.3.2 Commerce and Trade','Commerce includes activities that help buying and selling. Trade means buying and selling goods. Internal trade takes place within a country; external trade takes place between countries. Auxiliaries to trade are supporting services that help goods move from producers to consumers.'],
['1.3.3 Auxiliaries to Trade','1. Transport: removes difficulty of place by moving goods.\n2. Banking and finance: provides funds and payment facilities.\n3. Insurance: protects against specified risks and losses.\n4. Warehousing: stores goods until needed; removes difficulty of time.\n5. Advertising: informs customers and promotes products.\n6. Communication: helps buyers, sellers and businesses exchange information.'],
['1.4 Objectives of Business','Business objectives are the goals a business wants to achieve. Main objectives: market standing (good market position), innovation (new products and methods), productivity (efficient use of resources), physical and financial resources (proper access and use), earning profits (income for survival and growth) and social responsibility (considering customers, employees, society and environment).'],
['1.4.1 Importance of Profit','Profit is necessary for survival and growth. It provides funds for expansion, rewards owners for taking risks, helps build reputation and indicates business performance. Profit should be earned through fair and responsible practices.'],
['1.5 Business Risk','Business risk is the possibility of inadequate profit or loss due to uncertainty. Causes: natural (floods, earthquakes), human (theft, carelessness, strikes), economic (changes in demand, prices, competition and technology) and other causes (political disturbances and policy changes). Risk is an essential part of business; profit is generally the reward for bearing risk.'],
['1.6 Factors Before Starting a Business','1. Select line of business after studying demand, skills and competition.\n2. Decide size or scale.\n3. Choose location considering customers, raw materials, labour and transport.\n4. Arrange adequate finance.\n5. Arrange buildings, machines and equipment.\n6. Select capable employees.\n7. Understand tax rules and plan lawfully.\n8. Complete formalities, arrange resources and launch the enterprise.']
],qa:[
['What is business?','An economic activity involving production or purchase and sale of goods and services to earn profit and satisfy human needs.'],['State four characteristics of business.','Economic activity, regular dealings, exchange of goods/services, profit motive, uncertainty of return and risk. (Any four.)'],['Why is a single sale not normally business?','Business generally involves regular or continuous dealings; a one-time personal sale does not show regular activity.'],['Name the two main branches of business activities.','Industry and Commerce.'],['Differentiate between industry and commerce.','Industry produces or processes goods. Commerce includes trade and supporting activities that help goods reach consumers.'],['What are primary industries?','Industries connected with natural resources. Their types are extractive and genetic industries.'],['Differentiate extractive and genetic industries.','Extractive industries obtain products from nature, such as mining. Genetic industries breed plants and animals, such as poultry farming.'],['What are secondary industries?','Industries that use materials from primary industries to make finished goods or construct infrastructure.'],['What are auxiliaries to trade?','Supporting services such as transport, banking, insurance, warehousing, advertising and communication.'],['Explain four objectives of business.','Market standing, innovation, productivity, proper use of resources, profit and social responsibility. Explain any four.'],['What is business risk? State its causes.','Possibility of loss or inadequate profit due to uncertainty. Causes include natural, human, economic and other factors.'],['Why is profit important?','It supports survival, expansion, rewards owners, builds reputation and helps face uncertainty.'],['State four factors before starting a business.','Line of business, size, location, finance, facilities, workforce, tax planning and launch arrangements. Any four.']
],quiz:[
['Business is primarily a/an:', ['Economic activity','Religious activity','Political activity','Charitable activity'],0],['Which is NOT a characteristic of business?',['Regular dealings','Profit motive','Guaranteed return','Business risk'],2],['Industries connected with natural resources are:', ['Primary','Secondary','Tertiary','Construction'],0],['Mining is an example of:', ['Genetic','Extractive','Synthetic','Assembling'],1],['Poultry farming is a:', ['Genetic industry','Construction industry','Analytical industry','Trade activity'],0],['Joining parts to make a car is:', ['Analytical','Processing','Assembling','Extractive'],2],['Building roads and bridges belongs to:', ['Construction industry','Genetic industry','Retail trade','Banking'],0],['Commerce includes:', ['Only manufacturing','Trade and auxiliaries to trade','Only mining','Only farming'],1],['Which service removes difficulty of place?', ['Insurance','Transport','Warehousing','Advertising'],1],['Which service stores goods until needed?', ['Banking','Communication','Warehousing','Advertising'],2],['Which is an objective of business?', ['Innovation','Avoiding customers','Stopping production','Guaranteed profit'],0],['Profit helps a business to:', ['Survive and grow','Remove every risk','Guarantee returns','Avoid customers'],0],['Floods and earthquakes are which risk cause?', ['Human','Natural','Economic','Personal'],1],['A single occasional sale is generally:', ['Always business','Not enough to show regular business','A company','An industry'],1],['Which should be considered before starting a business?', ['Location','Finance','Workforce','All of these'],3]]},
{title:'Chapter 2: Forms of Business Organisation',notes:[
['2.1 Meaning and Forms','A business organisation is the form of ownership and management under which a business operates. Main forms: sole proprietorship, Joint Hindu Family Business, partnership, cooperative society and joint stock company.'],
['2.2 Sole Proprietorship','A business owned, managed and controlled by one person.','Easy meaning: A business owned and run by a single person.','Example: A small grocery or stationery shop.'],
['2.2.1 Features, Merits and Limitations of Sole Proprietorship','Features: single ownership; one-person control; unlimited liability (personal assets may pay business debts); owner bears risk and receives profit; no separate legal entity; continuity may be affected by owner’s death/incapacity; secrecy.\n\nMerits: quick decisions, direct incentive, personal satisfaction, easy formation/closure and personal customer contact.\n\nLimitations: limited resources, limited continuity, unlimited liability, limited managerial ability and difficulty expanding.'],
['2.3 Joint Hindu Family Business','A business owned and carried on by members of a Hindu Undivided Family under Hindu law.','Easy meaning: A family business run by eligible family members under Hindu law.','Karta: head of family who manages the business. Coparceners: family members having a legal interest in ancestral property.'],
['2.3.1 Features, Merits and Limitations of HUF Business','Features: membership by birth; governed by Hindu law; managed by Karta; Karta has unlimited liability while other coparceners generally have limited liability; continuity may remain after Karta’s death; minors may become members by birth.\n\nMerits: effective control, continuity, limited liability of other members and family loyalty.\n\nLimitations: limited resources, unlimited liability of Karta, dominance of Karta and limited managerial skills.'],
['2.4 Partnership','Partnership is an association of two or more persons who agree to carry on a lawful business and share its profits.','Easy meaning: Two or more people run a business together and share profits.','Example: Two friends jointly operating a clothing shop.'],
['2.4.1 Features, Merits and Limitations of Partnership','Features: two or more persons; agreement; lawful business; profit sharing; mutual agency; generally unlimited liability in ordinary partnership; firm is not a separate legal person in the same way as a company.\n\nMerits: relatively easy formation, shared decisions, more funds, shared risk and different skills.\n\nLimitations: unlimited liability, possible conflicts, lack of continuity and limited resources.'],
['2.4.2 Types of Partners','Active partner: takes part in daily work. Sleeping/dormant partner: invests but does not actively manage. Secret partner: participates but association is not publicly known. Nominal partner: lends their name. Partner by estoppel: represents themselves as a partner, causing outsiders to rely on that representation.'],
['2.4.3 Partnership Deed','A partnership deed is a written agreement containing the terms and conditions of partnership.','Easy meaning: A document recording the rules agreed upon by partners.','It may include firm name/address, partners’ details, nature of business, capital contribution, profit-sharing ratio, duties, admission/retirement rules and dispute settlement.'],
['2.5 Cooperative Society','A voluntary association of persons formed to protect their common economic interests.','Easy meaning: People join together to help one another economically.','Features: voluntary membership, separate legal status after registration, limited liability, democratic control (generally one member one vote), service motive and government rules.'],
['2.5.1 Merits, Limitations and Types of Cooperatives','Merits: equal voting, limited liability, stable existence, economies in operations and possible government support. Limitations: limited resources, management difficulties, less secrecy, government control and differences among members.\n\nTypes: consumer (supplies goods), producer (helps producers obtain inputs), marketing (helps sell products), farmers’ (supports farmers), credit (provides loans) and housing (helps members obtain housing).'],
['2.6 Joint Stock Company','A company is an association incorporated under law with a legal identity separate from its members.','Easy meaning: A company is legally separate from its owners.','Share: unit of company capital. Shareholder: owner of shares. Board of Directors: directs company affairs. Perpetual succession: company continues despite membership changes. Artificial person: legal entity created by law.'],
['2.6.1 Features, Merits and Limitations of Company','Features: artificial legal person; separate legal entity; incorporation; perpetual succession; management by directors; generally limited liability of shareholders; shares transferable subject to law and company type.\n\nMerits: limited liability, transferability of shares, continuity, ability to raise large capital and professional management.\n\nLimitations: complex formation, disclosure requirements, regulations, slower decisions, separation of ownership and control and conflicts of interest.'],
['2.6.2 Private and Public Companies','Private company: restricts transfer of shares, limits membership as prescribed by law and does not invite the public to subscribe to its securities. Easy meaning: it does not offer its shares to the general public.\n\nPublic company: a company that is not a private company under the Companies Act; it may invite the public to subscribe to securities subject to legal requirements.'],
['2.7 Choice of Form of Business Organisation','Consider: cost and ease of setting up; liability and personal risk; continuity; capital requirement; managerial ability; desired control; and nature/size of business.']
],qa:[
['What is a business organisation?','The form of ownership and management under which a business operates.'],['Name the main forms of business organisation.','Sole proprietorship, Joint Hindu Family Business, partnership, cooperative society and joint stock company.'],['Define sole proprietorship.','A business owned, managed and controlled by one person.'],['State four merits of sole proprietorship.','Quick decisions, direct incentive, easy formation/closure, customer contact and secrecy. Any four.'],['State four limitations of sole proprietorship.','Limited resources, unlimited liability, limited continuity, limited managerial ability and limited expansion. Any four.'],['Who is a Karta?','The head of a Joint Hindu Family Business who manages and controls the business.'],['What is partnership?','An association of two or more persons who agree to carry on a lawful business and share profits.'],['Explain mutual agency.','Each partner can act as an agent of the firm; authorised business acts may bind the firm and other partners.'],['What is a partnership deed?','A written agreement containing the terms and conditions of partnership.'],['Name four contents of a partnership deed.','Firm name, partners’ details, capital contribution, profit-sharing ratio, duties and dispute rules. Any four.'],['What is a cooperative society?','A voluntary association formed to protect members’ common economic interests.'],['Explain democratic control in a cooperative.','Generally, each member has one vote, giving members equal voting rights.'],['Name six types of cooperative societies.','Consumer, producer, marketing, farmers’, credit and cooperative housing societies.'],['What is a company?','An incorporated association with a legal identity separate from its members.'],['Explain perpetual succession.','A company continues to exist even when its members change.'],['Differentiate private and public company.','A private company restricts share transfer and does not invite public subscription. A public company may offer securities to the public subject to law.'],['State factors affecting choice of organisation.','Cost, liability, continuity, capital, managerial ability, control and nature/size of business.']
],quiz:[
['A sole proprietorship is owned by:', ['One person','Two partners','Government','Shareholders'],0],['Liability of a sole proprietor is generally:', ['Unlimited','Zero','Shared by public','Limited to shares'],0],['The head of a Joint Hindu Family Business is:', ['Director','Karta','Auditor','Promoter'],1],['Partnership is based on:', ['Agreement','Birth only','Government order only','Lottery'],0],['Minimum persons for an ordinary partnership:', ['One','Two','Ten','Fifty'],1],['The ability of a partner to bind the firm is:', ['Perpetual succession','Mutual agency','Public issue','Warehousing'],1],['Written agreement among partners is:', ['Prospectus','Partnership deed','Memorandum','Invoice'],1],['A sleeping partner generally:', ['Does not actively manage','Is always Karta','Owns government','Has no investment'],0],['A cooperative society mainly works for:', ['Service of members','One owner only','Political campaigning','Personal use of Karta'],0],['Usual cooperative voting principle:', ['One member, one vote','Votes by wealth','One share ten votes','Only manager votes'],0],['Which cooperative provides loans?', ['Credit','Housing','Consumer','Marketing'],0],['A company has:', ['Separate legal identity','No legal status','Always one owner','No continuity'],0],['Perpetual succession means:', ['Ends when member leaves','Continues despite member changes','No shares','Profit guaranteed'],1],['A company is managed by:', ['Board of Directors','Every customer','Only suppliers','Police'],0],['Which is a factor in choosing organisation?', ['Liability','Capital','Control','All of these'],3]]},
{title:'Chapter 3: Private, Public and Global Enterprises',notes:[
['3.1 Private and Public Sectors','Private sector enterprises are owned and managed by individuals or groups. Public sector enterprises are owned or controlled by government. A mixed economy has both sectors. Examples: private shops and companies; Indian Railways and government-owned enterprises.'],
['3.2 Forms of Public Sector Enterprises','The three main forms are departmental undertakings, statutory corporations and government companies.'],
['3.2.1 Departmental Undertakings','Public enterprises established as departments of a government ministry.','Easy meaning: They operate directly under a government department.','Textbook examples include Indian Railways and the Postal Department.'],
['3.2.1 Features, Merits and Limitations','Features: funded through government budget; employees generally government servants; direct ministry control; government accounting/audit; public accountability.\n\nMerits: strong government control, public accountability, revenue goes to government and suitability for sensitive activities.\n\nLimitations: less flexibility, delays, red tapism, political interference and limited response to consumer needs.'],
['3.2.2 Statutory Corporations','A statutory corporation is a public enterprise created by a special Act of Parliament or State Legislature.','Easy meaning: A government enterprise set up through a special law.','Features: created by special Act; separate legal identity; government ownership; powers set by the Act; generally more operational independence than departmental undertakings.'],
['3.2.2 Merits and Limitations','Merits: operational flexibility, independent management and public accountability. Limitations: possible government interference, rigid legal structure, conflict between commercial and public objectives and possible inefficiency.'],
['3.2.3 Government Companies','A government company is a company in which at least 51% of paid-up share capital is held by the Central Government, one or more State Governments, or jointly by them. The statutory definition also covers certain subsidiaries.','Easy meaning: A company in which government ownership is at least 51% of paid-up share capital.','Features: registered under company law; separate legal entity; required government shareholding; managed through company structure.'],
['3.2.3 Merits and Limitations','Merits: comparatively easier to establish than a statutory corporation, operational flexibility, professional managers and accountability. Limitations: government influence may reduce independence; political considerations may affect decisions; efficiency may suffer without competition.'],
['3.3 Changing Role of Public Sector','After Independence, public sector helped build India’s economic base. Contributions: infrastructure development (transport, communication, energy); regional balance (industries in less-developed regions); economies of scale (large projects); preventing concentration of economic power; import substitution (producing goods earlier imported).'],
['3.3.1 Policy Changes Since 1991','Measures included restructuring and reviving potentially viable public units, closing unviable units, reducing government equity in selected enterprises and protecting workers’ interests.'],
['3.3.2 Important Economic Terms','Disinvestment: sale of some government shareholding in a public enterprise. Privatisation: transfer of ownership/management or increased private participation. Liberalisation: reducing unnecessary restrictions on business. Globalisation: integration of a country’s economy with the world economy through trade, investment, technology and services.'],
['3.4 Global Enterprises','Global enterprises or multinational corporations are large companies operating in more than one country through subsidiaries, branches or other arrangements.','Easy meaning: Companies that do business in several countries.','Features: huge financial resources; international operations; advanced technology and research; product innovation; strong marketing and brands; access to global markets; coordination by a parent company with local operations.'],
['3.5 Joint Ventures','A joint venture is an arrangement in which two or more parties combine resources and expertise for a common business objective and share risks and rewards.','Easy meaning: Two or more businesses work together on a common project or business.','Reasons: enter markets, share capital and risks, access technology/expertise, develop products and expand.'],
['3.5.1 Types and Benefits of Joint Ventures','Contractual joint venture: parties cooperate through an agreement without necessarily creating a jointly owned new company. Equity-based joint venture: parties invest in and jointly own a separate business entity.\n\nBenefits: greater resources and capacity; access to new markets and technology; innovation; possible cost savings; use of an established brand or distribution network.'],
['3.6 Public Private Partnership (PPP)','PPP is an arrangement in which a public authority and a private party cooperate to provide infrastructure or public services.','Easy meaning: Government and a private business work together on a project.','Features: responsibilities and risks are shared; public side may provide assets/support/oversight; private side may provide investment, technology and management; terms are set by agreement. Strengths: combines public support with private expertise and may improve delivery. Weaknesses: possible conflicts, financing difficulties, delays or extra costs if contracts are poorly designed.']
],qa:[
['What is a mixed economy?','An economy in which both private and public sector enterprises operate.'],['Differentiate private and public sector.','Private enterprises are owned/managed by private individuals or groups. Public enterprises are owned or controlled by government.'],['Name three forms of public sector enterprises.','Departmental undertakings, statutory corporations and government companies.'],['What is a departmental undertaking?','A public enterprise operated as a department of a government ministry.'],['Give two merits and two limitations of departmental undertakings.','Merits: government control and public accountability. Limitations: less flexibility and delays due to official procedures.'],['What is a statutory corporation?','A public enterprise created by a special Act of Parliament or State Legislature.'],['State two features of statutory corporations.','They are created by a special Act and have a separate legal identity; they generally have more operational independence than departmental undertakings.'],['Define a government company.','A company with at least 51% of paid-up share capital held by the Central Government, one or more State Governments or jointly; certain subsidiaries are also covered.'],['Give two differences between departmental undertaking and government company.','A departmental undertaking works directly under a ministry and follows departmental procedures. A government company is incorporated under company law and has separate legal identity.'],['Explain four contributions of public sector.','Infrastructure development, regional balance, economies of scale, limiting concentration of economic power and import substitution. Any four.'],['What is disinvestment?','Sale of some government shareholding in a public sector enterprise.'],['What are global enterprises?','Large companies operating in more than one country through branches, subsidiaries or other arrangements.'],['State four features of global enterprises.','Huge financial resources, international operations, advanced technology, innovation, strong marketing and global market access. Any four.'],['What is a joint venture?','An arrangement in which two or more parties combine resources and expertise for a common objective and share risks and rewards.'],['Differentiate contractual and equity-based joint ventures.','Contractual JV is based on an agreement and need not create a jointly owned entity. Equity-based JV involves joint ownership of a separate entity.'],['What is PPP?','An arrangement in which a public authority and a private party cooperate to provide infrastructure or public services.'],['State two benefits and two limitations of PPP.','Benefits: combines public support and private expertise; shares project risks. Limitations: possible conflicts and financing difficulties.'],['What is globalisation?','Integration of a country’s economy with the world economy through trade, investment, technology and services.']
],quiz:[
['A mixed economy includes:', ['Only private sector','Only public sector','Both private and public sectors','No enterprises'],2],['A departmental undertaking works under:', ['Government ministry','Private shareholder','Foreign parent','Cooperative member'],0],['A statutory corporation is created by:', ['Special Act','Shop agreement','Family decision','Advertisement'],0],['Government company requires government shareholding of at least:', ['10%','25%','51%','100%'],2],['Which is registered under company law?', ['Government company','Departmental office','Informal shop','Unregistered club'],0],['Which is a public sector contribution?', ['Infrastructure development','Stopping trade','Removing jobs','Avoiding development'],0],['Disinvestment means:', ['Selling some government shares','Buying every shop','Closing all banks','Taxing consumers'],0],['Liberalisation generally means:', ['Reducing unnecessary controls','Banning all imports','Ending all businesses','Removing consumers'],0],['Global enterprises operate:', ['In one street only','In more than one country','Only one village','Only for government'],1],['Which is a feature of global enterprises?', ['Large financial resources','No technology','No marketing','No international activity'],0],['A joint venture involves:', ['Cooperation of two or more parties','Only one customer','No shared objective','Only one sole trader'],0],['Equity-based joint venture involves:', ['Joint ownership of a separate entity','No cooperation','Only a verbal promise','One sole trader'],0],['A contractual joint venture is primarily based on:', ['Agreement','Birth','Ministry','Share index'],0],['PPP stands for:', ['Public Private Partnership','Personal Profit Plan','Public Product Price','Private Personal Property'],0],['Which can be a weakness of PPP?', ['Possible conflicts','Guaranteed success','No agreement needed','No project risk'],0]]}

{"title":"Chapter 4: Business Services","notes":[["4.1 Meaning and Characteristics of Services","Services are intangible activities or benefits offered to satisfy needs. They are generally produced and consumed together, cannot usually be stored, and may vary in quality. Main characteristics: intangibility, inconsistency, inseparability, and perishability.","Easy meaning: A service is useful work done for a customer rather than a physical product.","Example: Banking, transport, insurance and medical services."],["4.2 Difference between Goods and Services","Goods are tangible and can usually be stored. Services are intangible and generally cannot be stored. Goods can often be separated from their producers, while many services are produced and consumed at the same time."],["4.3 Types of Business Services","Important business services include banking, insurance, transportation, communication and warehousing. They support production, distribution and exchange."],["4.4 Banking","A bank accepts deposits from the public and lends money to people and businesses. Commercial banks provide services such as accepting deposits, lending, transfer of funds, collection of cheques and locker facilities.","Easy meaning: A bank keeps money safely and provides payment and loan services.","Example: A customer deposits savings and uses a cheque or digital transfer to pay."],["4.4.1 Types of Banks","The chapter discusses commercial banks, cooperative banks, specialised banks and the central bank. The Reserve Bank of India is the central bank of India and regulates the banking system."],["4.4.2 E-Banking","E-banking means providing banking services through electronic channels such as ATMs, internet banking, mobile banking, debit cards and electronic fund transfer. It offers convenience and saves time."],["4.5 Insurance","Insurance is an agreement in which an insurer promises financial protection against specified loss in return for a premium. Important principles include utmost good faith, insurable interest, indemnity, contribution, subrogation, causa proxima and mitigation of loss.","Easy meaning: Insurance gives financial support when a covered loss happens.","Example: A vehicle insurance policy may cover specified accidental damage."],["4.5.4 Types of Insurance","The main types discussed are life insurance, fire insurance and marine insurance. Life insurance relates to human life; fire insurance covers specified fire-related losses; marine insurance covers specified risks connected with ships and cargo."],["4.6 Warehousing","Warehousing means keeping goods safely until they are needed. Warehouses help maintain regular supply, protect goods, support price stability and provide storage facilities. Types include private, public, bonded, government and cooperative warehouses."]],"qa":[["State any four characteristics of services.","Services are intangible, inconsistent, inseparable and perishable."],["What is e-banking?","E-banking is the delivery of banking services through electronic channels such as ATMs, internet and mobile banking."],["What is insurance?","Insurance is a contract in which the insurer provides protection against specified risks in return for a premium."],["Name the three main types of insurance.","Life insurance, fire insurance and marine insurance."],["What is warehousing?","Warehousing is the process of storing goods safely until they are required."]],"quiz":[["Which feature means services cannot usually be touched?",["Intangibility","Durability","Ownership","Standardisation"],0],["Which bank is the central bank of India?",["State Bank of India","Reserve Bank of India","A cooperative bank","A commercial branch"],1],["E-banking mainly uses:",["Electronic channels","Only paper ledgers","Only cash counters","Postal orders"],0],["The amount paid by the insured for insurance is called:",["Dividend","Premium","Interest","Rent"],1],["Which principle requires honest disclosure by both parties?",["Utmost good faith","Subrogation","Contribution","Mitigation"],0],["Fire insurance mainly covers specified loss due to:",["Fire","Illness","Old age","Unemployment"],0],["A bonded warehouse is generally used for goods:",["Awaiting customs clearance","Ready for retail display only","Being manufactured","Already consumed"],0],["Which is a function of commercial banks?",["Accepting deposits","Making laws","Printing all currency","Conducting elections"],0]]},{"title":"Chapter 5: Emerging Modes of Business","notes":[["5.1 E-Business","E-business means conducting business activities using computer networks and the internet. It includes buying and selling as well as customer service, supply, payments and business communication.","Easy meaning: E-business is business carried out using digital networks.","Example: An online store receiving an order through its website."],["5.2 Scope of E-Business","The scope includes B2B (business to business), B2C (business to consumer), C2C (consumer to consumer) and intra-B (within a business). These describe who participates in an electronic transaction."],["5.3 Online Transaction Process","A typical online purchase involves registration, placing an order, payment, order processing and delivery. The buyer should check product details, seller information, payment confirmation and delivery terms."],["5.4 Benefits of E-Business","Benefits include wider market reach, convenience, speed, lower paperwork, improved customer service, reduced transaction costs and easier access to information."],["5.5 Limitations and Requirements","Limitations include dependence on technology, security and privacy concerns, lack of personal contact, delivery delays and difficulty inspecting goods physically. A firm needs suitable hardware, software, internet access, trained people and secure payment arrangements."],["5.6 Security Concerns","Important concerns include unauthorised access, misuse of personal information, payment fraud, data loss and harmful software. Businesses should use secure systems, access controls, updates and responsible data practices."],["5.7 Business Process Outsourcing (BPO)","BPO means contracting a business process to an outside specialised organisation. It can help a firm focus on its main activities, use expert services and control costs.","Easy meaning: A company asks another specialist company to do a supporting task.","Example: A firm hires an outside agency to handle customer support."]],"qa":[["What is e-business?","E-business is conducting business activities through computer networks and the internet."],["Differentiate B2B and B2C.","B2B transactions take place between businesses, while B2C transactions take place between a business and final consumers."],["State four benefits of e-business.","Wider reach, convenience, faster transactions and reduced paperwork or transaction costs."],["What is BPO?","BPO is the practice of assigning a business process to an outside specialised service provider."],["Mention two limitations of e-business.","Security and privacy risks, and lack of physical inspection or personal contact."]],"quiz":[["E-business uses:",["Computer networks","Only face-to-face contact","Only printed catalogues","Only cash registers"],0],["B2B stands for:",["Business to Business","Buyer to Bank","Business to Buyer","Bank to Business"],0],["A sale from an online retailer to an individual customer is:",["B2C","C2C","B2B","Intra-B"],0],["Which is a benefit of e-business?",["Wider market reach","No need for security","No delivery process","Guaranteed profit"],0],["Which is a security concern?",["Unauthorised access","Product variety","Convenient timing","Wider reach"],0],["BPO means:",["Business Process Outsourcing","Business Product Ordering","Basic Payment Option","Bank Process Operation"],0],["Which is generally needed to start e-business?",["Internet and suitable technology","No communication system","Only a paper notice","No trained people"],0],["A consumer selling a used book to another consumer online is:",["C2C","B2B","B2C","Intra-B"],0]]},{"title":"Chapter 6: Social Responsibilities of Business and Business Ethics","notes":[["6.1 Social Responsibility","Social responsibility means the obligation of business to make decisions and take actions that protect and improve the welfare of society along with achieving business goals.","Easy meaning: A business should consider how its actions affect people and the environment.","Example: A factory treating waste before releasing it."],["6.2 Arguments for Social Responsibility","Business uses resources provided by society and affects many groups. Social responsibility can improve public image, reduce government intervention, support long-term survival and help solve social problems."],["6.3 Responsibility towards Interest Groups","Business responsibilities include fair treatment and safe conditions for employees; quality goods and fair prices for consumers; fair returns and correct information for investors; timely payments and fair dealing with suppliers; and obeying laws and contributing to community welfare."],["6.4 Kinds of Social Responsibility","Responsibilities are often discussed towards owners/investors, workers, consumers, government and community. Businesses should act honestly, pay lawful taxes, avoid unfair practices and support social development."],["6.5 Business and Environment Protection","Business activities may cause air, water, land and noise pollution. Environmental protection requires pollution prevention, efficient resource use, waste treatment, recycling and compliance with environmental rules."],["6.6 Pollution Control","Pollution control protects health, improves quality of life, reduces damage to ecosystems and supports sustainable development. Prevention and control measures should be built into business operations."],["6.7 Business Ethics","Business ethics are moral principles that guide business behaviour. Elements include top management commitment, a code of conduct, employee involvement, effective communication and regular evaluation.","Easy meaning: Business ethics means doing business honestly and fairly.","Example: Giving correct product information and refusing bribery."]],"qa":[["Define social responsibility.","It is the obligation of business to make decisions and take actions that protect and improve the welfare of society."],["State any four responsibilities towards employees.","Provide fair wages, safe working conditions, job-related training and respectful treatment."],["Why should business protect the environment?","To protect health and ecosystems, reduce pollution, conserve resources and support sustainable development."],["What is business ethics?","Business ethics are moral principles that guide the conduct and decisions of a business."],["Mention two elements of business ethics.","Commitment of top management and a written code of conduct."]],"quiz":[["Social responsibility considers the welfare of:",["Society along with business","Only competitors","Only owners","Only suppliers"],0],["Which group should receive safe working conditions?",["Employees","Competitors","Only advertisers","Unrelated firms"],0],["Which is an environmental responsibility?",["Treating industrial waste","Dumping waste untreated","Wasting water","Ignoring pollution"],0],["Business ethics are based on:",["Moral principles","Only sales targets","Personal likes","Advertising slogans"],0],["A code of conduct helps:",["Guide employee behaviour","Replace all laws","Guarantee profit","Avoid customer service"],0],["Which is a responsibility towards consumers?",["Quality goods at fair prices","False product claims","Hidden charges","Unsafe products"],0],["Pollution control helps protect:",["Health and ecosystems","Only company logos","Only packaging","Only sales records"],0],["Who should show commitment to ethical conduct?",["Top management","Only customers","Only competitors","Only delivery staff"],0]]},{"title":"Chapter 7: Formation of a Company","notes":[["7.1 Formation of a Company","Formation of a company is a process involving several legal and administrative steps. The chapter explains promotion, incorporation and commencement of business."],["7.2 Promotion","Promotion is the first stage. Promoters identify a business opportunity, examine its feasibility, decide the company’s name and take steps to bring the company into existence.","Easy meaning: Promotion means planning and preparing to start a company.","Example: Promoters study demand and arrange the initial plan for a new manufacturing company."],["7.2.1 Functions of Promoters","Promoters discover an idea, conduct preliminary investigation, decide the name, identify people who may provide capital and arrange professionals and documents needed for formation."],["7.2.2 Incorporation","Incorporation is the registration of a company under the applicable company law. Required documents and forms are submitted to the Registrar of Companies. On satisfaction, the Registrar issues a certificate of incorporation."],["7.3 Documents for Registration","Important documents include the Memorandum of Association, Articles of Association, consent of proposed directors where required, details of registered office and statutory declarations and particulars required by law."],["7.4 Certificate of Incorporation","The certificate of incorporation is issued by the Registrar after registration requirements are met. It is evidence that the company has been legally incorporated and has a separate legal identity."],["7.5 Commencement of Business","The chapter distinguishes incorporation from commencement of business and explains the legal requirements applicable to a company before it starts business. Companies must comply with the requirements in force under company law."]],"qa":[["What is promotion of a company?","Promotion is the process of identifying a business opportunity and taking preliminary steps to form a company."],["Who is a promoter?","A promoter is a person who undertakes the preliminary work required to form a company."],["What is incorporation?","Incorporation is the legal registration of a company with the Registrar of Companies."],["Name two important documents used in company formation.","Memorandum of Association and Articles of Association."],["What does the certificate of incorporation establish?","It is evidence that the company has been legally registered and has a separate legal identity."]],"quiz":[["The first stage in company formation is generally:",["Promotion","Winding up","Audit","Dividend payment"],0],["A promoter mainly:",["Takes preliminary steps to form a company","Audits every company account","Collects consumer tax","Runs the stock exchange"],0],["Incorporation means:",["Legal registration of a company","Closing a company","Selling company goods","Appointing customers"],0],["The company is registered by the:",["Registrar of Companies","Local retailer","Insurance agent","Transport operator"],0],["MOA stands for:",["Memorandum of Association","Minutes of Audit","Market of Assets","Method of Accounting"],0],["The certificate of incorporation is evidence of:",["Legal incorporation","Annual profit","Product quality","Market demand"],0],["Articles of Association mainly contain:",["Internal rules and regulations","Customer addresses","Supplier invoices","Advertising plans"],0],["Company formation includes:",["Legal and administrative steps","Only product advertising","Only hiring sales staff","Only opening a shop"],0]]},{"title":"Chapter 8: Sources of Business Finance","notes":[["8.1 Meaning and Importance of Business Finance","Business finance refers to the money required to establish, operate and expand a business. It is needed to buy fixed assets, meet day-to-day expenses and support growth.","Easy meaning: Business finance is the money a business needs to run and grow.","Example: A company needs funds to buy machinery and pay wages."],["8.2 Nature of Business Finance","Finance is required at every stage of business. The amount and type of finance depend on the nature, scale and period of business needs."],["8.3 Classification of Sources","Sources may be classified on the basis of period (short-term, medium-term and long-term), ownership (owned and borrowed) and source of generation (internal and external)."],["8.4 Retained Earnings","Retained earnings are the part of profit kept in the business instead of distributing it to shareholders. It is an internal source of finance and does not create a repayment obligation.","Easy meaning: The company reinvests some of its profit in the business.","Example: A company uses saved profits to purchase new equipment."],["8.5 Trade Credit and Factoring","Trade credit is credit extended by suppliers that allows a business to pay later. Factoring is an arrangement in which a business sells or assigns its receivables to a factor for finance and related services."],["8.6 Public Deposits","Public deposits are deposits invited directly by a company from the public for a specified period and under applicable rules. They may provide funds without issuing shares."],["8.7 Sources of Long-Term Finance","Long-term sources include shares, debentures, loans from financial institutions, retained earnings and other long-term borrowings. Equity shares represent ownership; debentures represent borrowed funds."],["8.8 Factors Affecting Choice of Finance","Choice depends on cost, risk, control, flexibility, period of finance, cash-flow position, tax considerations and the purpose for which funds are required."]],"qa":[["What is business finance?","Business finance is the money required for establishing, operating and expanding a business."],["What are retained earnings?","They are profits kept in the business rather than distributed to shareholders."],["What is trade credit?","Trade credit is credit given by suppliers that allows a buyer to pay for goods at a later date."],["Differentiate owned and borrowed funds.","Owned funds are provided by owners or retained from profits; borrowed funds are obtained as loans or debt and generally require repayment."],["State four factors affecting the choice of finance.","Cost, risk, control, flexibility and the period for which funds are needed."]],"quiz":[["Business finance is needed for:",["Establishing and operating business","Only decorating an office","Only paying personal bills","Only advertising competitors"],0],["Retained earnings are:",["Profits kept in the business","Loans from customers","Trade discounts","Taxes collected"],0],["Trade credit is provided by:",["Suppliers","Share registrars","Consumers","Competitors"],0],["Debentures are a form of:",["Borrowed capital","Owner’s personal savings","Retained stock","Trade discount"],0],["Equity shares represent:",["Ownership capital","A supplier invoice","A bank deposit receipt","A tax payment"],0],["Which is an internal source of finance?",["Retained earnings","Public deposits","Debentures","Bank loan"],0],["Which is a factor in choosing finance?",["Cost of funds","Office paint colour","Employee hobbies","Shop location alone"],0],["Factoring is related to:",["Receivables","Factory construction only","Employee training","Product packaging"],0]]},{"title":"Chapter 9: MSME and Business Entrepreneurship","notes":[["9.1 Meaning of MSME","MSME stands for Micro, Small and Medium Enterprises. These enterprises operate on a relatively smaller scale and play an important role in employment, production, exports and regional development.","Easy meaning: MSMEs are micro, small and medium-sized business units.","Example: A small food-processing unit or a local engineering workshop."],["9.2 Role of MSMEs in India","MSMEs generate employment, encourage entrepreneurship, use local resources, support large industries, contribute to exports and help reduce regional imbalances."],["9.3 Government Support","The chapter discusses institutional and government support for MSMEs, including finance, training, marketing assistance, technology support and development programmes."],["9.4 Entrepreneurship","Entrepreneurship is the process of identifying an opportunity, organising resources and starting or developing an enterprise while accepting business risk. An entrepreneur brings together land, labour, capital and ideas."],["9.5 Problems Associated with MSMEs","Common problems include inadequate finance, shortage of raw materials, outdated technology, marketing difficulties, competition, lack of skilled workers and delayed payments."],["9.6 Innovation and Entrepreneurship","Innovation means introducing a new or improved product, process or method. It helps enterprises improve quality, reduce costs, meet changing customer needs and remain competitive."]],"qa":[["What is the full form of MSME?","Micro, Small and Medium Enterprises."],["State four contributions of MSMEs.","Employment generation, use of local resources, support to large industries and contribution to exports."],["Who is an entrepreneur?","An entrepreneur identifies an opportunity, organises resources and undertakes the risk of starting or developing an enterprise."],["Mention four problems faced by MSMEs.","Inadequate finance, shortage of raw materials, outdated technology and marketing difficulties."],["What is innovation?","Innovation is the introduction of a new or improved product, process or method."]],"quiz":[["MSME stands for:",["Micro, Small and Medium Enterprises","Medium Sales Market Exchange","Micro Savings Management Entity","Main Small Manufacturing Enterprise"],0],["A major contribution of MSMEs is:",["Employment generation","Eliminating all competition","Replacing all large firms","Stopping exports"],0],["An entrepreneur primarily:",["Organises resources and takes business risk","Only purchases household goods","Works only as a customer","Avoids all decisions"],0],["Which is a common MSME problem?",["Inadequate finance","Unlimited free capital","No market competition","Guaranteed raw materials"],0],["Innovation means:",["Introducing new or improved ideas","Repeating every process unchanged","Avoiding customer feedback","Stopping product development"],0],["MSMEs can support large industries by:",["Supplying parts and services","Banning production","Removing all suppliers","Stopping distribution"],0],["Which support can help MSMEs?",["Training and technology assistance","No access to information","Blocking credit","Removing market access"],0],["Entrepreneurship can encourage:",["Economic development","Only price increases","Less innovation","No employment"],0]]},{"title":"Chapter 10: Internal Trade","notes":[["10.1 Meaning of Internal Trade","Internal trade means buying and selling of goods and services within the boundaries of a country. Payment is generally made in the country’s domestic currency.","Easy meaning: Trade carried out inside one country.","Example: A wholesaler in Madhya Pradesh selling goods to a retailer in Rajasthan."],["10.2 Types of Internal Trade","Internal trade is broadly classified into wholesale trade and retail trade. Wholesalers buy goods in large quantities and sell mainly to retailers; retailers sell goods in smaller quantities to final consumers."],["10.3 Services of Wholesalers","Wholesalers provide services to manufacturers such as large-scale buying, storage, financial assistance, risk bearing and market information. They provide retailers with regular supply, variety, credit facilities and advice."],["10.4 Retail Trade","Retail trade involves selling goods and services directly to final consumers for personal or household use. Retailers connect producers and consumers."],["10.5 Types of Retailers","Retailers may be itinerant or fixed-shop retailers. Itinerant retailers move from place to place; fixed-shop retailers operate from a fixed location. Fixed shops include small-scale and large-scale retailers."],["10.6 Large-Scale Retailers","Large-scale retail organisations include departmental stores, chain stores or multiple shops, mail-order houses, consumer cooperative stores and supermarkets. Each form has a different method of operation and customer service."],["10.7 Chambers of Commerce and Industry","Chambers of Commerce and Industry represent business interests and support internal trade through information, advice, training, representation and efforts to improve trade practices and infrastructure."],["10.8 GST","Goods and Services Tax (GST) is an indirect tax on the supply of goods and services. The chapter introduces its role in the taxation of internal trade."]],"qa":[["What is internal trade?","Internal trade is the buying and selling of goods and services within the boundaries of a country."],["Differentiate wholesale and retail trade.","Wholesalers buy and sell in large quantities, mainly to retailers; retailers sell goods in smaller quantities directly to final consumers."],["State four services of wholesalers to manufacturers.","Bulk buying, storage, financial assistance and bearing certain market risks."],["What is retail trade?","Retail trade means selling goods and services directly to final consumers for personal or household use."],["Mention two functions of Chambers of Commerce.","They represent business interests and provide information, advice and support for trade development."]],"quiz":[["Internal trade takes place:",["Within one country","Between two continents only","Only by sea","Only through online platforms"],0],["A wholesaler generally sells to:",["Retailers","Final consumers only","Only employees","Only government offices"],0],["A retailer sells mainly to:",["Final consumers","Manufacturers only","Other wholesalers only","Banks"],0],["Which is an itinerant retailer?",["A hawker","A department store","A supermarket","A chain store"],0],["Which is a large-scale retail organisation?",["Departmental store","Street hawker","Door-to-door seller","Weekly market stall"],0],["A service of wholesalers to manufacturers is:",["Bulk purchasing","Household consumption","Personal use","Retail display only"],0],["Chambers of Commerce help by:",["Representing business interests","Manufacturing all goods","Collecting household rent","Replacing retailers"],0],["GST stands for:",["Goods and Services Tax","General Sales Tariff","Government Service Trade","Goods Supply Transfer"],0]]},{"title":"Chapter 11: International Business","notes":[["11.1 Meaning of International Business","International business refers to business activities that take place across national boundaries. It includes trade in goods and services, investment, technology transfer and other cross-border business activities.","Easy meaning: Business carried out between people or organisations in different countries.","Example: An Indian company exporting textiles to another country."],["11.1.2 Difference between Internal and International Business","Internal business takes place within one country and generally uses domestic currency and laws. International business crosses national boundaries and may involve different currencies, legal systems, cultures, documentation and greater risks."],["11.1.4 Scope of International Business","The scope includes merchandise exports and imports, service exports and imports, licensing and franchising, foreign investment and contract manufacturing."],["11.2 Modes of Entry into International Business","Common modes include exporting and importing, contract manufacturing, licensing, franchising, joint ventures and wholly owned subsidiaries. Each mode differs in investment, control and risk."],["11.2.3 Licensing and Franchising","Licensing permits a foreign firm to use specified intellectual property for a fee or royalty. Franchising allows use of a business model, brand and operating system under agreed conditions."],["11.2.4 Joint Ventures","A joint venture is a business arrangement in which two or more parties create or operate an enterprise together. It can provide access to capital, technology, local knowledge and shared risk."],["11.3 Export and Import Procedure","Export and import transactions involve enquiries, quotations or proforma invoices, orders, finance arrangements, shipment, customs procedures and delivery. The exact documents depend on the transaction and applicable rules."],["11.4 Important Trade Documents","Documents discussed include trade enquiry, proforma invoice, export order, letter of credit, shipping order, shipping bill, bill of lading, airway bill, certificate of origin, commercial invoice, packing list and bill of entry."],["11.5 International Institutions","The chapter introduces international institutions and agreements that support international trade and development, including the World Trade Organization and other global financial and development institutions."]],"qa":[["What is international business?","International business consists of business activities carried out across national boundaries."],["State two differences between internal and international business.","Internal business takes place within one country; international business crosses national borders. International business may involve different currencies, laws and documentation."],["What is a letter of credit?","It is a bank’s undertaking to honour payment up to a specified amount under stated conditions for an export transaction."],["Differentiate bill of lading and airway bill.","A bill of lading is issued for goods carried by sea; an airway bill is issued for goods carried by air."],["What is a joint venture?","A joint venture is an arrangement in which two or more parties establish or operate a business together."],["Name any four documents used in international trade.","Proforma invoice, letter of credit, bill of lading and certificate of origin."]],"quiz":[["International business takes place:",["Across national boundaries","Only within one city","Only within one state","Only inside one shop"],0],["A sale of goods from India to another country is:",["Export","Import","Retailing","Warehousing"],0],["A letter of credit is generally issued by:",["A bank","A retailer","A shipping customer","A warehouse worker"],0],["A bill of lading relates to transport by:",["Sea","Air","Road only","Rail only"],0],["An airway bill relates to transport by:",["Air","Sea","Canal","Pipeline"],0],["Licensing generally allows use of:",["Specified intellectual property","A country’s currency","A customs port","A shipping route"],0],["A joint venture involves:",["Two or more cooperating parties","Only one seller","No agreement","Only one consumer"],0],["A certificate of origin identifies:",["The country where goods originate","The retail price only","The buyer’s age","The ship’s fuel"],0]]}
];
let ci=0,section='notes',answers={};const app=document.getElementById('app'),search=document.getElementById('search');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function fmt(s){return esc(s).replace(/\n/g,'<br>');}
function chapterBtns(){document.getElementById('chapters').innerHTML=C.map((c,i)=>`<button class="${i===ci?'active':''}" onclick="pickChapter(${i})">Chapter ${i+1}</button>`).join('');}
function pickChapter(i){ci=i;answers={};chapterBtns();render();window.scrollTo({top:0,behavior:'smooth'});}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{section=b.dataset.s;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render();});search.oninput=render;
function render(){let c=C[ci],q=search.value.toLowerCase().trim(),out=`<div class="card"><h2>${esc(c.title)}</h2><p class="muted">Study notes, important questions and practice quiz.</p></div>`;
if(section==='notes'){let arr=c.notes.filter(n=>n.join(' ').toLowerCase().includes(q));out+=arr.map(n=>`<section class="card"><h3>${esc(n[0])}</h3><p>${fmt(n[1])}</p>${n[2]?`<div class="definition">${fmt(n[2])}</div>`:''}${n[3]?`<p class="example">${fmt(n[3])}</p>`:''}</section>`).join('')||'<div class="card">No matching notes found.</div>';}
if(section==='qa'){let arr=c.qa.filter(x=>x.join(' ').toLowerCase().includes(q));out+=`<div class="card"><h3>Important Questions &amp; Answers</h3>${arr.map((x,i)=>`<div class="qa"><b>Q${i+1}. ${esc(x[0])}</b><div class="answer"><b>Ans.</b> ${esc(x[1])}</div></div>`).join('')||'No matching questions found.'}</div>`;}
if(section==='quiz'){out+=`<div class="card"><h3>Chapter ${ci+1} Quiz</h3><p class="muted">Choose one answer for each question and submit.</p>${c.quiz.map((x,i)=>`<div class="qa"><b>Q${i+1}. ${esc(x[0])}</b>${x[1].map((o,j)=>`<button class="opt ${answers[i]===j?'sel':''}" onclick="choose(${i},${j})">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div class="small" id="f${i}"></div></div>`).join('')}<div class="row"><button onclick="submitQuiz()">Submit Quiz</button><button onclick="resetQuiz()">Try Again</button></div><div id="score" class="score"></div></div>`;}
app.innerHTML=out;}
function choose(i,j){answers[i]=j;render();}function submitQuiz(){let c=C[ci],s=0;c.quiz.forEach((x,i)=>{if(answers[i]===x[2])s++;let f=document.getElementById('f'+i);if(f)f.textContent=answers[i]===x[2]?'Correct!':'Correct answer: '+ 'ABCD'[x[2]]+'. '+x[1][x[2]];});document.getElementById('score').textContent=`Your score: ${s} / ${c.quiz.length}`;}function resetQuiz(){answers={};render();}chapterBtns();render();
</script></body></html>
