const C=[
{title:'Chapter 1: Business, Trade and Commerce',notes:[
['1.1 Introduction','Business is an important economic activity. It makes goods and services available to people and supports economic development by creating jobs, using resources, increasing income and improving living standards.'],
['1.2 Meaning of Business','Business is an economic activity concerned with the production or purchase and sale of goods and services with the aim of earning profit and satisfying human needs.','Easy meaning: Business means making or buying and selling goods and services to earn income.','Examples: Grocery shop, clothing store, transport company and car factory.'],
['1.2.1 Characteristics of Business','1. Economic activity: performed to earn income.\n2. Production or procurement: goods are produced or purchased for sale.\n3. Sale or exchange: goods/services are exchanged for value.\n4. Dealings in goods and services: business deals in products or services.\n5. Regularity: activities are generally repeated.\n6. Profit motive: earning profit is important.\n7. Uncertainty of return: profit is not fixed.\n8. Business risk: possibility of loss exists.'],
['1.3 Classification of Business Activities','Business activities are broadly divided into Industry and Commerce. Industry is concerned with production or processing. Commerce includes trade and auxiliaries to trade.'],
['1.3.1 Industry','Primary industries are connected with natural resources. Extractive industries obtain products from nature (mining, fishing, farming); genetic industries breed plants and animals (poultry, cattle breeding).\n\nSecondary industries use materials from primary industries. Manufacturing converts raw materials into finished goods: analytical (separates components, e.g. oil refinery), synthetic (combines materials, e.g. cement), processing (several stages, e.g. sugar/paper) and assembling (joins parts, e.g. cars). Construction industries build roads, bridges, buildings, dams and canals.\n\nTertiary industries provide support services to other industries and trade, such as transport, banking, insurance, warehousing and communication.'],
['1.3.2 Commerce and Trade','Commerce includes activities that help buying and selling. Trade means buying and selling goods. Internal trade takes place within a country; external trade takes place between countries. Auxiliaries to trade are supporting services that help goods move from producers to consumers.'],
['1.3.3 Auxiliaries to Trade','1. Transport: removes difficulty of place by moving goods.\n2. Banking and finance: provides funds and payment facilities.\n3. Insurance: protects against specified risks and losses.\n4. Warehousing: stores goods until needed; removes difficulty of time.\n5. Advertising: informs customers and promotes products.\n6. Communication: helps buyers, sellers and businesses exchange information.'],
['1.4 Objectives of Business','Business objectives are the goals a business wants to achieve. Main objectives: market standing (good market position), innovation (new products and methods), productivity (efficient use of resources), physical and financial resources (proper access and use), earning profits (income for survival and growth) and social responsibility (considering customers, employees, society and environment).'],
['1.4.1 Importance of Profit','Profit is necessary for survival and growth. It provides funds for expansion, rewards owners for taking risks, helps build reputation and indicates business performance. Profit should be earned through fair and responsible practices.'],
['1.5 Business Risk','Business risk is the possibility of inadequate profit or loss due to uncertainty. Causes: natural (floods, earthquakes), human (theft, carelessness, strikes), economic (changes in demand, prices, competition and technology) and other causes (political disturbances and policy changes). Risk is an essential part of business; profit is generally the reward for bearing risk.'],
['1.6 Factors Before Starting a Business','1. Select line of business after studying demand, skills and competition.\n2. Decide size or scale.\n3. Choose location considering customers, raw materials, labour and transport.\n4. Arrange adequate finance.\n5. Arrange buildings, machines and equipment.\n6. Select capable employees.\n7. Understand tax rules and plan lawfully.\n8. Complete formalities, arrange resources and launch the enterprise.']

{title:'Chapter 2: Forms of Business Organisation',notes:[
['2.1 Meaning and Forms','A business organisation is the form of ownership and management under which a business operates. Main forms: sole proprietorship, Joint Hindu Family Business, partnership, cooperative society and joint stock company.'],
['2.2 Sole Proprietorship','A business owned, managed and controlled by one person.','Easy meaning: A business owned and run by a single person.','Example: A small grocery or stationery shop.'],
['2.2.1 Features, Merits and Limitations of Sole Proprietorship','Features: single ownership; one-person control; unlimited liability (personal assets may pay business debts); owner bears risk and receives profit; no separate legal entity; continuity may be affected by owner’s death/incapacity; secrecy.\n\nMerits: quick decisions, direct incentive, personal satisfaction, easy formation/closure and personal customer contact.\n\nLimitations: limited resources, limited continuity, unlimited liability, limited managerial ability and difficulty expanding.'],
['2.3 Joint Hindu Family Business','A business owned and carried on by members of a Hindu Undivided Family under Hindu law.','Easy meaning: A family business run by eligible family members under Hindu law.','Karta: head of family who manages the business. Coparceners: family members having a legal interest in ancestral property.'],
['2.3.1 Features, Merits and Limitations of HUF Business','Features: membership by birth; governed by Hindu law; managed by Karta; Karta has unlimited liability while other coparceners generally have limited liability; continuity may remain after Karta’s death; minors may become members by birth.\n\nMerits: effective control, continuity, limited liability of other members and family loyalty.\n\nLimitations: limited resources, unlimited liability of Karta, dominance of Karta and limited managerial skills.'],
['2.4 Partnership','Partnership is an association of two or more persons who agree to carry on a lawful business and share its profits.','Easy meaning: Two or more people run a business together and share profits.','Example: Two friends jointly operating a clothing shop.'],
['2.4.1 Features, Merits and Limitations of Partnership','Features: two or more persons; agreement; lawful business; profit sharing; mutual agency; generally unlimited liability in ordinary partnership; firm is not a separate legal person in the same way as a company.\n\nMerits: relatively easy formation, shared decisions, more funds, shared risk and different skills.\n\nLimitations: unlimited liability, possible conflicts, lack of continuity and limited resources.'],
['2.4.2 Types of Partners','Active partner: takes part in daily work. Sleeping/dormant partner: invests but does not actively manage. Secret partner: participates but association is not publicly known. Nominal partner: lends their name. Partner by estoppel: represents themselves as a partner, causing outsiders to rely on that representation.'],
['2.4.3 Partnership Deed','A partnership deed is a written agreement containing the terms and conditions of partnership.','Easy meaning: A document recording the rules agreed upon by partners.','It may include firm name/address, partners’ details, nature of business, capital contribution, profit-sharing ratio, duties, admission/retirement rules and dispute settlement.'],
['2.5 Cooperative Society','A voluntary association of persons formed to protect their common economic interests.','Easy meaning: People join together to help one another economically.','Features: voluntary membership, separate legal status after registration, limited liability, democratic control (generally one member one vote), service motive and government rules.'],
['2.5.1 Merits, Limitations and Types of Cooperatives','Merits: equal voting, limited liability, stable existence, economies in operations and possible government support. Limitations: limited resources, management difficulties, less secrecy, government control and differences among members.\n\nTypes: consumer (supplies goods), producer (helps producers obtain inputs), marketing (helps sell products), farmers’ (supports farmers), credit (provides loans) and housing (helps members obtain housing).'],
['2.6 Joint Stock Company','A company is an association incorporated under law with a legal identity separate from its members.','Easy meaning: A company is legally separate from its owners.','Share: unit of company capital. Shareholder: owner of shares. Board of Directors: directs company affairs. Perpetual succession: company continues despite membership changes. Artificial person: legal entity created by law.'],
['2.6.1 Features, Merits and Limitations of Company','Features: artificial legal person; separate legal entity; incorporation; perpetual succession; management by directors; generally limited liability of shareholders; shares transferable subject to law and company type.\n\nMerits: limited liability, transferability of shares, continuity, ability to raise large capital and professional management.\n\nLimitations: complex formation, disclosure requirements, regulations, slower decisions, separation of ownership and control and conflicts of interest.'],
['2.6.2 Private and Public Companies','Private company: restricts transfer of shares, limits membership as prescribed by law and does not invite the public to subscribe to its securities. Easy meaning: it does not offer its shares to the general public.\n\nPublic company: a company that is not a private company under the Companies Act; it may invite the public to subscribe to securities subject to legal requirements.'],
['2.7 Choice of Form of Business Organisation','Consider: cost and ease of setting up; liability and personal risk; continuity; capital requirement; managerial ability; desired control; and nature/size of business.']

['What is a business organisation?','The form of ownership and management under which a business operates.'],['Name the main forms of business organisation.','Sole proprietorship, Joint Hindu Family Business, partnership, cooperative society and joint stock company.'],['Define sole proprietorship.','A business owned, managed and controlled by one person.'],['State four merits of sole proprietorship.','Quick decisions, direct incentive, easy formation/closure, customer contact and secrecy. Any four.'],['State four limitations of sole proprietorship.','Limited resources, unlimited liability, limited continuity, limited managerial ability and limited expansion. Any four.'],['Who is a Karta?','The head of a Joint Hindu Family Business who manages and controls the business.'],['What is partnership?','An association of two or more persons who agree to carry on a lawful business and share profits.'],['Explain mutual agency.','Each partner can act as an agent of the firm; authorised business acts may bind the firm and other partners.'],['What is a partnership deed?','A written agreement containing the terms and conditions of partnership.'],['Name four contents of a partnership deed.','Firm name, partners’ details, capital contribution, profit-sharing ratio, duties and dispute rules. Any four.'],['What is a cooperative society?','A voluntary association formed to protect members’ common economic interests.'],['Explain democratic control in a cooperative.','Generally, each member has one vote, giving members equal voting rights.'],['Name six types of cooperative societies.','Consumer, producer, marketing, farmers’, credit and cooperative housing societies.'],['What is a company?','An incorporated association with a legal identity separate from its members.'],['Explain perpetual succession.','A company continues to exist even when its members change.'],['Differentiate private and public company.','A private company restricts share transfer and does not invite public subscription. A public company may offer securities to the public subject to law.'],['State factors affecting choice of organisation.','Cost, liability, continuity, capital, managerial ability, control and nature/size of business.']

{title:'Chapter 3: Private, Public and Global Enterprises',notes:[
['3.1 Private and Public Sectors','Private sector enterprises are owned and managed by individuals or groups. Public sector enterprises are owned or controlled by government. A mixed economy has both sectors. Examples: private shops and companies; Indian Railways and government-owned enterprises.'],
['3.2 Forms of Public Sector Enterprises','The three main forms are departmental undertakings, statutory corporations and government companies.'],
['3.2.1 Departmental Undertakings','Public enterprises established as departments of a government ministry.','Easy meaning: They operate directly under a government department.','Textbook examples include Indian Railways and the Postal Department.'],
['3.2.1 Features, Merits and Limitations','Features: funded through government budget; employees generally government servants; direct ministry control; government accounting/audit; public accountability.\n\nMerits: strong government control, public accountability, revenue goes to government and suitability for sensitive activities.\n\nLimitations: less flexibility, delays, red tapism, political interference and limited response to consumer needs.'],
['3.2.2 Statutory Corporations','A statutory corporation is a public enterprise created by a special Act of Parliament or State Legislature.','Easy meaning: A government enterprise set up through a special law.','Features: created by special Act; separate legal identity; government ownership; powers set by the Act; generally more operational independence than departmental undertakings.'],
['3.2.2 Merits and Limitations','Merits: operational flexibility, independent management and public accountability. Limitations: possible government interference, rigid legal structure, conflict between commercial and public objectives and possible inefficiency.'],
['3.2.3 Government Companies','A government company is a company in which at least 51% of paid-up share capital is held by the Central Government, one or more State Governments, or jointly by them. The statutory definition also covers certain subsidiaries.','Easy meaning: A company in which government ownership is at least 51% of paid-up share capital.','Features: registered under company law; separate legal entity; required government shareholding; managed through company structure.'],
['3.2.3 Merits and Limitations','Merits: comparatively easier to establish than a statutory corporation, operational flexibility, professional managers and accountability. Limitations: government influence may reduce independence; political considerations may affect decisions; efficiency may suffer without competition.'],
['3.3 Changing Role of Public Sector','After Independence, public sector helped build India’s economic base. Contributions: infrastructure development (transport, communication, energy); regional balance (industries in less-developed regions); economies of scale (large projects); preventing concentration of economic power; import substitution (producing goods earlier imported).'],
['3.3.1 Policy Changes Since 1991','Measures included restructuring and reviving potentially viable public units, closing unviable units, reducing government equity in selected enterprises and protecting workers’ interests.'],
['3.3.2 Important Economic Terms','Disinvestment: sale of some government shareholding in a public enterprise. Privatisation: transfer of ownership/management or increased private participation. Liberalisation: reducing unnecessary restrictions on business. Globalisation: integration of a country’s economy with the world economy through trade, investment, technology and services.'],
['3.4 Global Enterprises','Global enterprises or multinational corporations are large companies operating in more than one country through subsidiaries, branches or other arrangements.','Easy meaning: Companies that do business in several countries.','Features: huge financial resources; international operations; advanced technology and research; product innovation; strong marketing and brands; access to global markets; coordination by a parent company with local operations.'],
['3.5 Joint Ventures','A joint venture is an arrangement in which two or more parties combine resources and expertise for a common business objective and share risks and rewards.','Easy meaning: Two or more businesses work together on a common project or business.','Reasons: enter markets, share capital and risks, access technology/expertise, develop products and expand.'],
['3.5.1 Types and Benefits of Joint Ventures','Contractual joint venture: parties cooperate through an agreement without necessarily creating a jointly owned new company. Equity-based joint venture: parties invest in and jointly own a separate business entity.\n\nBenefits: greater resources and capacity; access to new markets and technology; innovation; possible cost savings; use of an established brand or distribution network.'],
['3.6 Public Private Partnership (PPP)','PPP is an arrangement in which a public authority and a private party cooperate to provide infrastructure or public services.','Easy meaning: Government and a private business work together on a project.','Features: responsibilities and risks are shared; public side may provide assets/support/oversight; private side may provide investment, technology and management; terms are set by agreement. Strengths: combines public support with private expertise and may improve delivery. Weaknesses: possible conflicts, financing difficulties, delays or extra costs if contracts are poorly designed.']
],qa:[
['What is a mixed economy?','An economy in which both private and public sector enterprises operate.'],['Differentiate private and public sector.','Private enterprises are owned/managed by private individuals or groups. Public enterprises are owned or controlled by government.'],['Name three forms of public sector enterprises.','Departmental undertakings, statutory corporations and government companies.'],['What is a departmental undertaking?','A public enterprise operated as a department of a government ministry.'],['Give two merits and two limitations of departmental undertakings.','Merits: government control and public accountability. Limitations: less flexibility and delays due to official procedures.'],['What is a statutory corporation?','A public enterprise created by a special Act of Parliament or State Legislature.'],['State two features of statutory corporations.','They are created by a special Act and have a separate legal identity; they generally have more operational independence than departmental undertakings.'],['Define a government company.','A company with at least 51% of paid-up share capital held by the Central Government, one or more State Governments or jointly; certain subsidiaries are also covered.'],['Give two differences between departmental undertaking and government company.','A departmental undertaking works directly under a ministry and follows departmental procedures. A government company is incorporated under company law and has separate legal identity.'],['Explain four contributions of public sector.','Infrastructure development, regional balance, economies of scale, limiting concentration of economic power and import substitution. Any four.'],['What is disinvestment?','Sale of some government shareholding in a public sector enterprise.'],['What are global enterprises?','Large companies operating in more than one country through branches, subsidiaries or other arrangements.'],['State four features of global enterprises.','Huge financial resources, international operations, advanced technology, innovation, strong marketing and global market access. Any four.'],['What is a joint venture?','An arrangement in which two or more parties combine resources and expertise for a common objective and share risks and rewards.'],['Differentiate contractual and equity-based joint ventures.','Contractual JV is based on an agreement and need not create a jointly owned entity. Equity-based JV involves joint ownership of a separate entity.'],['What is PPP?','An arrangement in which a public authority and a private party cooperate to provide infrastructure or public services.'],['State two benefits and two limitations of PPP.','Benefits: combines public support and private expertise; shares project risks. Limitations: possible conflicts and financing difficulties.'],['What is globalisation?','Integration of a country’s economy with the world economy through trade, investment, technology and services.']

let ci=0,section='notes',answers={};const app=document.getElementById('app'),search=document.getElementById('search');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function fmt(s){return esc(s).replace(/\n/g,'<br>');}
function chapterBtns(){document.getElementById('chapters').innerHTML=C.map((c,i)=>`<button class="${i===ci?'active':''}" onclick="pickChapter(${i})">Chapter ${i+1}</button>`).join('');}
function pickChapter(i){ci=i;answers={};chapterBtns();render();window.scrollTo({top:0,behavior:'smooth'});}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{section=b.dataset.s;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render();});search.oninput=render;
function render(){let c=C[ci],q=search.value.toLowerCase().trim(),out=`<div class="card"><h2>${esc(c.title)}</h2><p class="muted">Study notes, important questions and practice quiz.</p></div>`;
if(section==='notes'){let arr=c.notes.filter(n=>n.join(' ').toLowerCase().includes(q));out+=arr.map(n=>`<section class="card"><h3>${esc(n[0])}</h3><p>${fmt(n[1])}</p>${n[2]?`<div class="definition">${fmt(n[2])}</div>`:''}${n[3]?`<p class="example">${fmt(n[3])}</p>`:''}</section>`).join('')||'<div class="card">No matching notes found.</div>';}
if(section==='qa'){let arr=c.qa.filter(x=>x.join(' ').toLowerCase().includes(q));out+=`<div class="card"><h3>Important Questions &amp; Answers</h3>${arr.map((x,i)=>`<div class="qa"><b>Q${i+1}. ${esc(x[0])}</b><div class="answer"><b>Ans.</b> ${esc(x[1])}</div></div>`).join('')||'No matching questions found.'}</div>`;}
if(section==='quiz'){out+=`<div class="card"><h3>Chapter ${ci+1} Quiz</h3><p class="muted">Choose one answer for each question and submit.</p>${c.quiz.map((x,i)=>`<div class="qa"><b>Q${i+1}. ${esc(x[0])}</b>${x[1].map((o,j)=>`<button class="opt ${answers[i]===j?'sel':''}" onclick="choose(${i},${j})">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div class="small" id="f${i}"></div></div>`).join('')}<div class="row"><button onclick="submitQuiz()">Submit Quiz</button><button onclick="resetQuiz()">Try Again</button></div><div id="score" class="score"></div></div>`;}
app.innerHTML=out;}
function choose(i,j){answers[i]=j;render();}function submitQuiz(){let c=C[ci],s=0;c.quiz.forEach((x,i)=>{if(answers[i]===x[2])s++;let f=document.getElementById('f'+i);if(f)f.textContent=answers[i]===x[2]?'Correct!':'Correct answer: '+ 'ABCD'[x[2]]+'. '+x[1][x[2]];});document.getElementById('score').textContent=`Your score: ${s} / ${c.quiz.length}`;}function resetQuiz(){answers={};render();}chapterBtns();render();
</script></body></html>
