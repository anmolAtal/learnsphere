.logo{font-size:22px;font-weight:900}.logo span{color:var(--cyan)}button{color:var(--text);font-weight:700;cursor:pointer;font-size:14px;border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:10px 14px;transition:.2s}
button:hover{border-color:var(--cyan);transform:translateY(-2px)}button:disabled{opacity:.55;cursor:default;transform:none}.primary{background:linear-gradient(120deg,#536ff0,#8b61df);border:0}
main{max-width:1150px;margin:auto;padding:28px 18px 60px}.hero{padding:38px 22px;border:1px solid #34466b;border-radius:25px;background:linear-gradient(130deg,#172c55,#182047 60%,#30204e);box-shadow:0 15px 35px #0007;text-align:center}
.tag{color:var(--cyan);font-weight:bold;letter-spacing:2px;font-size:12px}h1{font-size:clamp(30px,5vw,48px);margin:13px 0}.hero p,.sub{color:#c5d1e9;line-height:1.65;max-width:760px;margin:0 auto 18px}

.tile{min-height:145px;padding:19px;border-radius:18px;background:linear-gradient(145deg,#192846,#101a30);border:1px solid #344766;box-shadow:0 8px 0 #080e1c,0 13px 25px #0005;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:9px}

input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--border);background:#0b1428;color:white;font-size:15px;margin:8px 0 12px}

@media(max-width:600px){header{align-items:flex-start;flex-direction:column}main{padding:20px 13px 45px}.hero{padding:30px 16px}.tile{min-height:130px}}

<script>
const chapters=[{"n": 1, "title": "Introduction to Accounting", "notes": [["Meaning of Accounting", "Accounting is the process of identifying, measuring, recording, classifying, summarising, analysing and communicating financial information to users.", "Easy meaning: Accounting keeps a useful record of money-related business activities."], ["Economic Events and Transactions", "An economic event affects the financial position of an organisation. A transaction is an event that can be measured in money and recorded, such as buying goods or paying rent.", "Example: Purchase of goods for ₹5,000 is a recordable transaction."], ["Accounting Process", "The main steps are identification, measurement, recording, classification, summarising, analysis, interpretation and communication.", "Example: Transactions are first recorded and later summarised in financial statements."], ["Users of Accounting Information", "Internal users include owners and managers. External users include investors, lenders, suppliers, employees, customers, government and researchers.", "They use accounting information for decisions such as investment, lending and planning."], ["Objectives and Role", "Main objectives include maintaining records, calculating profit or loss, showing financial position and providing information for decisions. Accounting also helps in planning, control, comparison and legal compliance.", "Accounting is more than book-keeping because it also helps users understand results."]], "qa": [["What is accounting?", "Accounting is the process of identifying, measuring, recording, classifying, summarising, analysing and communicating financial information."], ["Name two internal users of accounting information.", "Owners and managers."], ["Name two external users of accounting information.", "Investors and lenders."], ["What is an asset?", "An asset is a resource owned or controlled by a business that is expected to provide future benefit."], ["State any two objectives of accounting.", "To maintain systematic records and to calculate profit or loss."]], "quiz": [["Accounting information is mainly concerned with:", ["Financial transactions", "Personal opinions", "Weather reports", "Political events"], 0, "Accounting records and communicates financial information."], ["Which is an internal user?", ["Bank", "Manager", "Supplier", "Government"], 1, "A manager works within the organisation."], ["Which is an example of an asset?", ["Bank loan", "Furniture", "Creditor", "Outstanding rent"], 1, "Furniture is a resource owned by the business."], ["The amount invested by the owner is called:", ["Revenue", "Capital", "Expense", "Loss"], 1, "Owner's investment is capital."], ["Accounting helps to calculate:", ["Only sales", "Profit or loss", "Only cash", "Only number of workers"], 1, "One objective is to determine profit or loss."]]}, {"n": 2, "title": "Theory Base of Accounting", "notes": [["Generally Accepted Accounting Principles (GAAP)", "GAAP refers to the common rules, concepts, conventions and standards followed while preparing accounts.", "Easy meaning: These are accepted guidelines that make accounts reliable and comparable."], ["Business Entity and Money Measurement", "Business Entity treats the business as separate from its owner. Money Measurement records only events that can be measured in money.", "Example: Owner's personal expenses are not business expenses."], ["Going Concern, Accounting Period and Cost", "Going Concern assumes the business will continue operating. Accounting Period divides its life into reporting periods. Cost Concept records assets at acquisition cost.", "Example: Accounts may be prepared for one financial year."], ["Dual Aspect, Revenue Recognition and Matching", "Dual Aspect means every transaction has two effects and maintains Assets = Liabilities + Capital. Revenue Recognition records revenue when earned. Matching records related expenses in the same period as revenue.", "Example: Salary for the current year is charged to that year's expenses."], ["Other Concepts and Systems", "Full Disclosure requires important information to be shown. Consistency uses methods regularly. Conservatism avoids overstating profit/assets. Materiality focuses on significant items. Objectivity relies on verifiable evidence. Accounting may follow cash or accrual basis and single or double entry systems.", "Accounting standards support uniformity and comparability."]], "qa": [["What is GAAP?", "GAAP means generally accepted accounting principles followed in accounting."], ["State the business entity concept.", "The business is treated as separate from its owner for accounting purposes."], ["What is the dual aspect concept?", "Every transaction has two aspects, and the accounting equation remains balanced."], ["What is the matching concept?", "Expenses of a period are matched with the revenue earned in that period."], ["What is the going concern concept?", "It assumes that the business will continue its operations for the foreseeable future."]], "quiz": [["Business Entity Concept separates:", ["Business and owner", "Assets and liabilities", "Cash and bank", "Sales and purchases"], 0, "The business has a separate accounting identity."], ["The accounting equation is:", ["Assets = Capital - Liabilities", "Assets = Liabilities + Capital", "Capital = Assets + Liabilities", "Assets = Expenses"], 1, "This expresses the dual aspect concept."], ["Under cost concept, an asset is generally recorded at:", ["Market value every day", "Acquisition cost", "Owner's estimate", "Selling price"], 1, "Historical cost is the basis at acquisition."], ["Matching concept matches expenses with:", ["Capital", "Revenue of the period", "Drawings", "Loans"], 1, "Related expenses are charged against period revenue."], ["Which concept requires important information to be disclosed?", ["Consistency", "Full Disclosure", "Going Concern", "Money Measurement"], 1, "Full Disclosure requires relevant material information."]]}, {"n": 3, "title": "Recording of Transactions – I", "notes": [["Source Documents and Vouchers", "Source documents provide evidence of transactions. Examples include cash memos, invoices, receipts, debit notes, credit notes and bank advice. A voucher is prepared to record and authorise a transaction.", "Keep supporting documents safely for verification."], ["Accounting Equation", "Assets = Liabilities + Capital. Every transaction affects at least two items while keeping the equation balanced.", "Example: Owner brings ₹50,000 cash: Assets increase by ₹50,000 and Capital increases by ₹50,000."], ["Debit and Credit", "Debit (Dr.) is the left side of an account and Credit (Cr.) is the right side. Under traditional rules: debit the receiver and credit the giver; debit what comes in and credit what goes out; debit expenses/losses and credit incomes/gains.", "The correct rule depends on the type of account."], ["Rules for Accounts", "Personal Account: Debit the receiver, Credit the giver. Real Account: Debit what comes in, Credit what goes out. Nominal Account: Debit expenses and losses, Credit incomes and gains.", "Example: Rent paid in cash: Rent A/c Dr.; To Cash A/c."], ["Journal and Ledger", "Journal is the book of original entry where transactions are recorded date-wise. Ledger contains separate accounts and receives postings from the journal. A journal entry includes date, particulars, ledger folio and debit/credit amounts.", "Narration briefly explains the entry."]], "qa": [["What is a source document?", "A source document is written evidence supporting a business transaction."], ["Write the accounting equation.", "Assets = Liabilities + Capital."], ["What is a journal?", "Journal is the book in which transactions are first recorded in chronological order."], ["State the rule for a nominal account.", "Debit all expenses and losses; credit all incomes and gains."], ["What is posting?", "Posting is the process of transferring journal entries to their respective ledger accounts."]], "quiz": [["The book of original entry is:", ["Ledger", "Journal", "Trial Balance", "Balance Sheet"], 1, "Transactions are first recorded in the journal."], ["The accounting equation is:", ["A=L+C", "A=C-L", "L=A+C", "A=L-C"], 0, "Assets equal liabilities plus capital."], ["For a nominal account, expenses are:", ["Credited", "Debited", "Ignored", "Balanced"], 1, "Expenses and losses are debited."], ["A cash memo is a:", ["Source document", "Ledger account", "Financial statement", "Trial balance"], 0, "It provides evidence of a cash sale or purchase."], ["Transferring journal entries to ledger is:", ["Balancing", "Posting", "Casting", "Auditing"], 1, "This process is called posting."]]}, {"n": 4, "title": "Recording of Transactions – II", "notes": [["Need for Special Purpose Books", "When transactions become numerous, recording every transaction in one journal is time-consuming. Special purpose books group similar transactions for faster and more accurate recording.", "Examples include purchases book and sales book."], ["Cash Book", "Cash book records cash and bank transactions. It may be a single-column, double-column or triple-column cash book. It also serves as a cash account and, where applicable, a bank account.", "Cash book records both receipts and payments."], ["Petty Cash Book", "A petty cash book records small recurring payments such as postage, conveyance and stationery. Under the imprest system, the petty cashier receives a fixed amount which is replenished by the amount spent.", "This reduces work in the main cash book."], ["Other Subsidiary Books", "Purchases book records credit purchases of goods for resale; sales book records credit sales of goods. Purchases returns book records goods returned to suppliers; sales returns book records goods returned by customers. Bills receivable/payable books record bills accepted/received.", "Cash purchases and cash sales are entered in the cash book, not these credit books."], ["Journal Proper and Ledger Posting", "Journal proper records transactions not entered in other subsidiary books, such as opening entries, adjustment entries and rectification entries. Periodically, totals are posted to ledger accounts.", "Trade discount is generally deducted from invoice price; cash discount is recorded."]], "qa": [["Why are special purpose books maintained?", "They classify similar transactions and make recording quicker and more efficient."], ["What is a cash book?", "A book that records all cash and bank receipts and payments."], ["What is a petty cash book?", "A book used to record small routine payments."], ["Which book records credit purchases of goods for resale?", "Purchases Book."], ["What is the imprest system?", "A system in which petty cash is restored periodically to a fixed amount by reimbursing the amount spent."]], "quiz": [["Credit purchases of goods for resale are recorded in:", ["Sales Book", "Purchases Book", "Cash Book", "Journal Proper"], 1, "Purchases book records credit purchases of goods."], ["Small routine expenses are recorded in:", ["Petty Cash Book", "Sales Book", "Bills Receivable Book", "Ledger only"], 0, "The petty cash book records minor payments."], ["Cash sales are recorded in:", ["Sales Book", "Cash Book", "Purchases Book", "Purchases Returns Book"], 1, "Sales book is for credit sales of goods."], ["Under imprest system, petty cash is restored to:", ["A fixed amount", "Zero", "Sales value", "Bank balance"], 0, "The fixed float is replenished by the amount spent."], ["Goods returned to suppliers are recorded in:", ["Sales Returns Book", "Purchases Returns Book", "Sales Book", "Cash Book"], 1, "It records returns outward."]]}, {"n": 5, "title": "Bank Reconciliation Statement", "notes": [["Meaning and Need", "A Bank Reconciliation Statement (BRS) is prepared to explain the differences between the bank balance shown by the cash book and the pass book/bank statement on a particular date.", "It helps check accuracy and identify omissions or errors."], ["Timing Differences", "Differences may arise because cheques issued are not yet presented for payment, cheques deposited are not yet collected, or direct deposits/payments are recorded by the bank before the business records them.", "These differences may clear with time."], ["Errors and Other Differences", "Errors may be made by the business or the bank. Bank charges, interest, standing instructions and direct collections may appear in the bank statement first.", "Update the cash book for items not yet recorded by the business."], ["Preparation from Cash Book Balance", "Starting with a favourable cash book balance, add items that make the pass book balance higher and subtract items that make it lower. Reverse the treatment when starting with an overdraft or pass book balance.", "Always identify which balance is the starting point."], ["Adjusted Cash Book", "An adjusted cash book is prepared first for items such as bank charges, interest credited/debited and direct payments/collections. The remaining timing differences are then used to prepare BRS.", "BRS is a reconciliation statement, not an account."]], "qa": [["What is BRS?", "A statement prepared to reconcile the cash book bank balance with the bank statement/pass book balance."], ["Give two causes of difference between cash book and pass book.", "Cheques issued but not presented and cheques deposited but not yet collected."], ["What are bank charges?", "Charges deducted by the bank for services, usually recorded in the cash book when known."], ["What is an unpresented cheque?", "A cheque issued by the business but not yet presented to the bank for payment."], ["Why is BRS prepared?", "To explain differences and check the correctness of bank records."]], "quiz": [["BRS compares:", ["Cash and sales", "Cash book and pass book balances", "Assets and liabilities", "Journal and ledger"], 1, "It reconciles the two bank balances."], ["A cheque issued but not presented generally makes pass book balance:", ["Higher than cash book", "Lower than cash book", "Always equal", "Zero"], 0, "Cash book has already reduced the balance, but bank has not."], ["Bank charges are first recorded by:", ["Bank", "Customer only", "Supplier", "Owner"], 0, "The bank deducts charges and shows them in the statement."], ["BRS is prepared on:", ["A particular date", "Only at business start", "Every transaction", "Only at year end"], 0, "It reconciles balances as on a specified date."], ["A cheque deposited but not collected is also called:", ["Unpresented cheque", "Uncredited cheque", "Dishonoured bill", "Petty cash"], 1, "The bank has not yet credited it."]]}, {"n": 6, "title": "Trial Balance and Rectification of Errors", "notes": [["Meaning and Objectives", "A trial balance is a statement of debit and credit balances or totals of ledger accounts on a particular date. It checks arithmetical accuracy, helps locate errors and assists in preparing financial statements.", "Agreement does not prove that every error is absent."], ["Methods of Preparation", "Three methods are totals method, balances method and totals-cum-balances method. Under the balances method, debit and credit balances of ledger accounts are listed in their respective columns.", "The balances method is commonly used."], ["Errors Not Disclosed by Trial Balance", "Errors of complete omission, principle, compensating errors and certain errors of commission may not affect agreement of the trial balance.", "A trial balance can agree even when accounts contain mistakes."], ["Types of Errors", "Errors may be classified as errors of omission, commission, principle and compensating errors. An error of omission means a transaction is wholly or partly left out; commission includes wrong posting or calculation; principle means violation of an accounting principle.", "Example: Purchase of machinery wrongly debited to Purchases A/c is an error of principle."], ["Rectification and Suspense Account", "Errors may be corrected before or after preparing the trial balance. When the trial balance difference is temporarily placed in Suspense Account, it is closed after locating and correcting the errors.", "Rectification entries correct the affected accounts."]], "qa": [["What is a trial balance?", "A statement of debit and credit balances of ledger accounts prepared on a particular date."], ["State two objectives of trial balance.", "To check arithmetical accuracy and to help prepare financial statements."], ["What is an error of omission?", "An error in which a transaction is wholly or partly not recorded."], ["What is an error of principle?", "An error caused by violating an accounting principle, such as treating a capital expense as revenue expense."], ["What is a suspense account?", "A temporary account used to place the difference in a trial balance until errors are located."]], "quiz": [["Trial balance is prepared from:", ["Journal entries only", "Ledger accounts", "Cash memos", "Invoices"], 1, "Ledger balances or totals are used."], ["Which error may not affect trial balance agreement?", ["One-sided posting error", "Complete omission", "Wrong debit total", "Wrong credit total"], 1, "A completely omitted transaction leaves both sides unrecorded."], ["Purchase of machinery debited to Purchases A/c is:", ["Error of principle", "Error of omission", "Compensating error", "No error"], 0, "A capital item is wrongly treated as a revenue purchase."], ["Suspense Account is generally:", ["Permanent income", "Temporary account", "Asset only", "Expense only"], 1, "It temporarily holds an unexplained difference."], ["Trial balance agreement proves:", ["All errors are absent", "Only arithmetical agreement", "Profit is earned", "Cash is correct"], 1, "Some errors do not affect agreement."]]}, {"n": 7, "title": "Depreciation, Provisions and Reserves", "notes": [["Meaning and Features of Depreciation", "Depreciation is the gradual, permanent decrease in the value of a fixed asset due to use, passage of time or obsolescence. It allocates the depreciable cost over useful life.", "It is a process of cost allocation, not simply market valuation."], ["Causes and Need", "Causes include wear and tear, passage of time, expiry of legal rights, obsolescence and abnormal factors. Depreciation helps match cost with revenue, show a fair financial position and comply with law.", "Land with unlimited life is generally not depreciated."], ["Factors and Methods", "Depreciation depends on asset cost, estimated residual value and useful life. Straight Line Method charges an equal amount each year. Written Down Value Method charges a fixed percentage on the opening book value.", "SLM = (Cost − Residual Value) ÷ Useful Life."], ["Depletion and Amortisation", "Depletion refers to the reduction in natural resources such as mines and oil wells. Amortisation is the writing off of the cost of intangible assets over their useful life.", "These terms apply to different kinds of assets."], ["Provisions and Reserves", "A provision is an amount set aside for a known liability or expected loss whose exact amount may be uncertain; it is charged against profit. A reserve is an appropriation of profit kept to strengthen the financial position or meet future needs.", "Provision is a charge against profit; reserve is an appropriation of profit."]], "qa": [["What is depreciation?", "Depreciation is the gradual and permanent decrease in the value of a fixed asset due to use, time or obsolescence."], ["Write the SLM formula.", "Annual Depreciation = (Cost of Asset − Residual Value) ÷ Useful Life."], ["What is written down value method?", "A method in which depreciation is charged at a fixed rate on the asset's opening book value each year."], ["Differentiate depletion and amortisation.", "Depletion applies to natural resources; amortisation applies to intangible assets."], ["What is a provision?", "An amount charged against profit for a known liability or expected loss whose exact amount is uncertain."]], "quiz": [["SLM charges depreciation:", ["Equal amount each year", "Increasing amount", "No amount", "Only at sale"], 0, "Straight line method charges a constant annual amount."], ["Depreciation is mainly a process of:", ["Cost allocation", "Cash collection", "Market price fixing", "Revaluation"], 0, "It allocates depreciable cost over useful life."], ["Depletion is related to:", ["Natural resources", "Furniture", "Debtors", "Cash"], 0, "Mines and oil wells are examples."], ["A reserve is generally:", ["Charge against profit", "Appropriation of profit", "Liability always", "Cash expense"], 1, "Reserve is created out of profits."], ["WDV depreciation is calculated on:", ["Original cost every year", "Opening book value", "Residual value only", "Sales"], 1, "The rate is applied to the written down value."]]}, {"n": 8, "title": "Financial Statements – I", "notes": [["Meaning and Purpose", "Financial statements are prepared to communicate the financial performance and position of a business. They include the Trading Account, Profit and Loss Account and Balance Sheet.", "They help owners and other users make decisions."], ["Capital and Revenue Items", "Capital expenditure gives benefit over more than one accounting period, such as purchase of machinery. Revenue expenditure is incurred for day-to-day operations, such as wages or rent. Capital receipts are generally non-recurring sources such as capital introduced or loan proceeds; revenue receipts arise from normal activities.", "Correct classification is necessary for correct profit and asset values."], ["Trading Account", "Trading Account is prepared to find gross profit or gross loss. It includes opening stock, purchases less returns, direct expenses on the debit side and sales less returns and closing stock on the credit side.", "Gross Profit = Net Sales − Cost of Goods Sold."], ["Profit and Loss Account", "Profit and Loss Account is prepared to find net profit or net loss. Indirect expenses and losses are debited; indirect incomes and gains are credited.", "Net Profit = Gross Profit + Indirect Incomes − Indirect Expenses."], ["Balance Sheet", "A Balance Sheet shows assets, liabilities and capital on a particular date. Items may be grouped and arranged in order of liquidity or permanence.", "It is a statement of financial position, not an account."]], "qa": [["What are financial statements?", "Statements prepared to show the financial performance and financial position of a business."], ["What is capital expenditure?", "Expenditure that provides benefit over more than one accounting period."], ["What is a Trading Account prepared for?", "To determine gross profit or gross loss."], ["What is a Balance Sheet?", "A statement showing assets, liabilities and capital on a particular date."], ["Write the formula for gross profit.", "Gross Profit = Net Sales − Cost of Goods Sold."]], "quiz": [["Trading Account determines:", ["Net profit", "Gross profit", "Capital", "Cash balance"], 1, "Trading account finds gross profit or loss."], ["Purchase of machinery is generally:", ["Revenue expenditure", "Capital expenditure", "Revenue receipt", "Drawings"], 1, "Machinery gives benefit over multiple periods."], ["Balance Sheet shows position on:", ["A particular date", "Every hour", "Only date of purchase", "Any future date"], 0, "It reports financial position at a point in time."], ["Indirect expenses are recorded in:", ["Trading Account", "Profit and Loss Account", "Cash Book only", "Sales Book"], 1, "P&L account includes indirect expenses."], ["Gross profit is:", ["Net sales minus cost of goods sold", "Assets minus liabilities", "Capital plus drawings", "Cash minus bank"], 0, "This is the gross profit formula."]]}, {"n": 9, "title": "Financial Statements – II", "notes": [["Need for Adjustments", "Adjustments are needed under accrual accounting so that income earned and expenses incurred are recorded in the correct period, even if cash has not yet been received or paid.", "They help calculate correct profit and show a fair financial position."], ["Closing Stock and Expenses", "Closing stock is generally shown on the credit side of Trading Account and as a current asset in the Balance Sheet. Outstanding expenses are added to the related expense and shown as a liability. Prepaid expenses are deducted from expense and shown as an asset.", "Adjustments commonly have two effects."], ["Income Adjustments", "Accrued income is added to income and shown as an asset. Income received in advance is deducted from current income and shown as a liability.", "Record income in the period in which it is earned."], ["Depreciation, Bad Debts and Provisions", "Depreciation is charged to P&L and deducted from the asset. Bad debts are charged to P&L and deducted from debtors. Provision for doubtful debts and provision for discount on debtors are calculated as per the question and accounting treatment.", "Avoid counting the same loss twice."], ["Other Adjustments", "Manager's commission may be calculated on profit before or after charging commission as specified. Interest on capital is treated according to the agreement and question. Each adjustment must be considered for both the relevant account and Balance Sheet where applicable.", "Read carefully whether commission is before or after charging it."]], "qa": [["Why are adjustments made while preparing financial statements?", "To record income and expenses in the correct accounting period under the accrual basis."], ["How is outstanding expense treated?", "It is added to the related expense and shown as a liability."], ["How is prepaid expense treated?", "It is deducted from the related expense and shown as an asset."], ["What is accrued income?", "Income earned during the period but not yet received."], ["How is depreciation treated in final accounts?", "It is debited to Profit and Loss Account and deducted from the related asset."]], "quiz": [["Outstanding expenses are shown as:", ["Asset", "Liability", "Income", "Capital"], 1, "They are expenses due but not yet paid."], ["Prepaid expenses are:", ["Liabilities", "Assets", "Incomes", "Drawings"], 1, "They represent a future benefit."], ["Accrued income means income:", ["Received in advance", "Earned but not received", "Not earned", "Written off"], 1, "It has been earned in the current period."], ["Closing stock is shown in:", ["Trading Account and Balance Sheet", "Only Cash Book", "Only Journal", "Only P&L"], 0, "It appears as a credit in Trading A/c and an asset in Balance Sheet."], ["Bad debts are generally charged to:", ["Trading Account", "Profit and Loss Account", "Capital Account", "Sales Account"], 1, "Bad debts are a loss/expense."]]}];

function renderQuestion(){
 const c=chapters[current],box=document.getElementById('content');if(!box)return;
 if(qIndex>=c.quiz.length){box.innerHTML=`<div class="panel"><h2>🎉 Quiz Completed!</h2><h3>Your Score: ${score} / ${c.quiz.length}</h3><p class="muted">${score===c.quiz.length?'Excellent! Perfect score.':'Good effort! Review the notes and try again.'}</p><button class="primary" onclick="startQuiz()">Try Again</button><button onclick="setTab('notes')">Review Notes</button></div>`;return;}
 answered=false;const q=c.quiz[qIndex];
 box.innerHTML=`<div class="panel"><p class="muted">Question ${qIndex+1} of ${c.quiz.length}</p><h3>${q[0]}</h3>${q[1].map((a,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback"></div></div>`;
}
function answer(i){if(answered)return;answered=true;const q=chapters[current].quiz[qIndex];if(i===q[2])score++;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.style.borderColor='#42d9e8';});document.getElementById('feedback').innerHTML=(i===q[2]?'✅ Correct! ':'❌ Correct answer: '+q[1][q[2]]+'. ')+q[3]+`<br><button class="primary" style="margin-top:14px" onclick="qIndex++;renderQuestion()">${qIndex===chapters[current].quiz.length-1?'See Result':'Next Question →'}</button>`;}
home();
</script></body></html>
